{{- if and .Values.cluster.enabled (eq .Values.cluster.role "management") }}
{{- $namespaces := list "argocd" }}
{{- range .Values.services }}
{{- if and $.Values.cluster.enabled (index $.Values.stages .stage) (or (not .role) (eq $.Values.cluster.role .role)) }}
{{- $namespaces = append $namespaces .namespace }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-35'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Management cluster platform charts and the controlplane Authentik root.
  sourceRepos:
    - {{ required "management project needs fleet.repository" .Values.fleet.repository | quote }}
    - https://github.com/ThriftyStack/controlplane.git
  destinations:
    {{- range $namespaces | uniq }}
    - server: {{ $.Values.cluster.server | quote }}
      namespace: {{ . | quote }}
    {{- end }}
  clusterResourceWhitelist:
    - {group: '', kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
    - {group: scheduling.k8s.io, kind: PriorityClass}
    - {group: pkg.crossplane.io, kind: Provider}
    - {group: pkg.crossplane.io, kind: DeploymentRuntimeConfig}
    - {group: vault.upbound.io, kind: ProviderConfig}
    - {group: vault.vault.upbound.io, kind: Mount}
    - {group: vault.vault.upbound.io, kind: Policy}
    - {group: kubernetes.vault.upbound.io, kind: AuthBackendConfig}
    - {group: kubernetes.vault.upbound.io, kind: AuthBackendRole}
    - {group: pki.vault.upbound.io, kind: SecretBackendRootCert}
    - {group: pki.vault.upbound.io, kind: SecretBackendIntermediateCertRequest}
    - {group: pki.vault.upbound.io, kind: SecretBackendRootSignIntermediate}
    - {group: pki.vault.upbound.io, kind: SecretBackendIntermediateSetSigned}
    - {group: pki.vault.upbound.io, kind: SecretBackendRole}
    - {group: opentofu.upbound.io, kind: ProviderConfig}
    - {group: opentofu.upbound.io, kind: Workspace}
{{- end }}
