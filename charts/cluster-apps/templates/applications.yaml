{{- range .Values.services }}
{{- if and $.Values.cluster.enabled (index $.Values.stages .stage) (or (not .role) (eq $.Values.cluster.role .role)) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ if ne $.Values.cluster.id "management" }}{{ $.Values.cluster.id }}-{{ end }}{{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: {{ $.Values.cluster.id }}
  source:
    repoURL: {{ .repoURL | default "https://github.com/ThriftyStack/platform.git" }}
    targetRevision: {{ .targetRevision | default "main" }}
    {{- if .directory }}
    directory:
      recurse: false
    {{- else }}
    helm:
      releaseName: {{ .releaseName }}
      {{- if .skipTests }}
      skipTests: true
      {{- end }}
      valueFiles:
      - "../../../clusters/{{ $.Values.cluster.id }}/cluster.yaml"
      {{- range .valueFiles }}
      - "../../../clusters/{{ $.Values.cluster.id }}/{{ . }}"
      {{- end }}
    {{- end }}
    path: {{ .path }}
  destination:
    server: {{ $.Values.cluster.server | quote }}
    namespace: {{ .namespace }}
  {{- with .ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    {{- range .syncOptions }}
    - {{ . }}
    {{- end }}
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    managedNamespaceMetadata:
      labels:
        istio-injection: disabled
        {{- range $key, $value := .namespaceLabels }}
        {{ $key }}: {{ $value }}
        {{- end }}
{{- end }}
{{- end }}
