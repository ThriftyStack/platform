{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "netbird.name" . }}
  labels:
    {{- include "netbird.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "netbird.name" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "netbird.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "netbird.selectorLabels" . | nindent 8 }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "netbird.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: netbird
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Image ENTRYPOINT starts `netbird service run` then `netbird up`.
          # Only wrap it to set a stable ordinal hostname (mgmt-nb-0, …).
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              export NB_HOSTNAME="{{ .Values.hostnamePrefix }}-${POD_NAME##*-}"
              exec /usr/local/bin/netbird-entrypoint.sh
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.setupKeySecretName | quote }}
                  key: NB_SETUP_KEY
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NB_LOG_LEVEL
              value: info
            # Avoid requiring /var/log/netbird on a read-only path.
            - name: NB_LOG_FILE
              value: console
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_RESOURCE
                - SYS_ADMIN
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/netbird
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["netbird", "status", "--check", "live"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["netbird", "status", "--check", "ready"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["netbird", "status", "--check", "startup"]
            periodSeconds: 2
            timeoutSeconds: 10
            failureThreshold: 90
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.stateStorage.size | quote }}
        {{- with .Values.stateStorage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
{{- end }}
