---
# Inert until a cluster profile supplies identity and stage flags.
# Secrets: create Secret authentik-credentials in namespace authentik before sync.
# Keys (envFrom): AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL__HOST,
# AUTHENTIK_POSTGRESQL__USER, AUTHENTIK_POSTGRESQL__NAME, AUTHENTIK_POSTGRESQL__PASSWORD.
# Also include postgresql-password for the Bitnami/Postgres subchart auth.existingSecret.
# File storage for icons and uploads. Authentik 2025.12+ reads this at /data
# (files live under /data/media). The claim name matches the volume below.
media:
  claimName: authentik-data
  size: 10Gi
  storageClass: longhorn

# Nightly logical backup. Enabled for the management release. The job exits
# before pg_dump while ageRecipient is still the placeholder.
backup:
  enabled: true
  schedule: "15 3 * * *"
  ageRecipient: age1s7npftgtwq3ylwy5cpyederc3tawwgz2shdrr9m8csrs85e5d4ysx0e9y5
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  postgres:
    secretName: authentik-credentials
    hostKey: AUTHENTIK_POSTGRESQL__HOST
    userKey: AUTHENTIK_POSTGRESQL__USER
    databaseKey: AUTHENTIK_POSTGRESQL__NAME
    passwordKey: AUTHENTIK_POSTGRESQL__PASSWORD
  minio:
    endpoint: https://s3.adminio.biz:9000
    region: eu-poznan-1
    bucket: authentik-backups
    prefix: mgmt
    # Namespaced SecretStore in this chart. The management AppProject has no
    # ClusterSecretStore rule, and nothing else creates oke-vault.
    secretStore: oke-vault
    secretStoreKind: SecretStore
    # KV v2 mount is infra. The policy reads infra/data/authentik/*.
    vaultPath: authentik/backup-minio
    vaultServer: https://vault.devoops.uk
    vaultMount: infra
    vaultKvVersion: v2
    vaultAuthPath: jwt-management
    # terraform vault/management_jwt.tf replaces "/" in authentik/authentik-eso.
    vaultRole: authentik_authentik-eso
    vaultAudience: vault-oke
    esoServiceAccount: authentik-eso
    controllerServiceAccount: external-secrets
    controllerNamespace: external-secrets
    listenerCaConfigMap: oke-vault-listener-ca
    listenerCaKey: ca.crt
    # Public listener chain, E1 then R1. Not a private key.
    listenerCa: |
      -----BEGIN CERTIFICATE-----
      MIIB8DCCAXagAwIBAgIQJ3nJNbPRG2En3JnbsAQhBTAKBggqhkjOPQQDAzAdMRsw
      GQYDVQQDExJEZXZPb3BzIFJvb3QgQ0EgUjEwHhcNMjYwOTA2MDg0MjU3WhcNMzEw
      OTA1MDg0MjU3WjAyMRAwDgYDVQQKEwdEZXZPb3BzMR4wHAYDVQQDExVEZXZPb3Bz
      IElzc3VpbmcgQ0EgRTEwdjAQBgcqhkjOPQIBBgUrgQQAIgNiAAQX573taRKiI1Vr
      9yVh8gEgLrHOMbyUWp265GO9MnVvi6msq2P4wgxkAZJeKIO7SMbw7gcrjrJz2rez
