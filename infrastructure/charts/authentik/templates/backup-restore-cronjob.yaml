{{- if and .Values.backup.enabled .Values.backup.restoreTest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup-restore-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: restore-test
spec:
  schedule: {{ .Values.backup.restoreTest.schedule | quote }}
  suspend: {{ .Values.backup.restoreTest.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: restore-test
        spec:
          restartPolicy: Never
          serviceAccountName: authentik-backup
          automountServiceAccountToken: false
          # Same restricted pod as the backup Job. The Postgres sidecar overrides
          # to uid 999, the user that image's entrypoint and initdb expect.
          securityContext:
            {{- include "thrifty-authentik.restrictedPod" . | nindent 12 }}
          initContainers:
            - name: fetch
              image: {{ .Values.backup.images.awsCli | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/fetch.sh"]
              workingDir: /tmp
              env:
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                {{- include "thrifty-authentik.backupAwsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                {{- include "thrifty-authentik.restrictedContainer" (dict "runAsUser" 1000 "runAsGroup" 1000) | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
                {{- include "thrifty-authentik.minioCaMount" . | nindent 16 }}
            - name: decrypt
              image: {{ .Values.backup.images.age | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/age"]
              args:
                - --decrypt
                - --identity
                - /identity/{{ .Values.backup.restoreTest.ageIdentityKey }}
                - --output
                - /work/plain/authentik.dump
                - /work/enc/authentik.dump.age
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              securityContext:
                {{- include "thrifty-authentik.restrictedContainer" (dict "runAsUser" 1000 "runAsGroup" 1000) | nindent 16 }}
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: identity
                  mountPath: /identity
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
            # Native sidecar: stays up while restore runs, then the kubelet
            # stops it when restore exits so the Job can succeed.
            - name: postgres
              restartPolicy: Always
              image: {{ .Values.backup.images.postgres | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: POSTGRES_USER
                  value: authentik
                - name: POSTGRES_PASSWORD
                  value: restore-test
                - name: POSTGRES_DB
                  value: authentik
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              startupProbe:
                exec:
                  command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
                periodSeconds: 2
                failureThreshold: 60
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                {{- include "thrifty-authentik.restrictedContainer" (dict "runAsUser" 999 "runAsGroup" 999) | nindent 16 }}
              volumeMounts:
                - name: pgdata
                  mountPath: /var/lib/postgresql/data
                - name: pgrun
                  mountPath: /var/run/postgresql
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: restore
              image: {{ .Values.backup.images.postgres | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/restore.sh"]
              env:
                - name: PGPASSWORD
                  value: restore-test
              securityContext:
                {{- include "thrifty-authentik.restrictedContainer" (dict "runAsUser" 1000 "runAsGroup" 1000) | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: authentik-backup-scripts
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: pgdata
              emptyDir: {}
            - name: pgrun
              emptyDir: {}
            - name: identity
              secret:
                secretName: {{ .Values.backup.restoreTest.ageIdentitySecret }}
            {{- include "thrifty-authentik.minioCaVolume" . | nindent 12 }}
{{- end }}
