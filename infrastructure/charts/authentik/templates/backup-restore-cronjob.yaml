{{- if and .Values.backup.enabled .Values.backup.restoreTest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup-restore-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: restore-test
spec:
  schedule: {{ .Values.backup.restoreTest.schedule | quote }}
  suspend: {{ .Values.backup.restoreTest.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: restore-test
        spec:
          restartPolicy: Never
          serviceAccountName: authentik-backup
          automountServiceAccountToken: false
          initContainers:
            - name: fetch
              image: {{ .Values.backup.images.awsCli | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/fetch.sh"]
              env:
                {{- include "thrifty-authentik.backupAwsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
            - name: decrypt
              image: {{ .Values.backup.images.age | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/age"]
              args:
                - --decrypt
                - --identity
                - /identity/{{ .Values.backup.restoreTest.ageIdentityKey }}
                - --output
                - /work/plain/authentik.dump
                - /work/enc/authentik.dump.age
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: identity
                  mountPath: /identity
                  readOnly: true
            # Native sidecar: stays up while restore runs, then the kubelet
            # stops it when restore exits so the Job can succeed.
            - name: postgres
              restartPolicy: Always
              image: {{ .Values.backup.images.postgres | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: POSTGRES_USER
                  value: authentik
                - name: POSTGRES_PASSWORD
                  value: restore-test
                - name: POSTGRES_DB
                  value: authentik
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              startupProbe:
                exec:
                  command: ["pg_isready", "-U", "authentik", "-d", "authentik"]
                periodSeconds: 2
                failureThreshold: 60
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: pgdata
                  mountPath: /var/lib/postgresql/data
          containers:
            - name: restore
              image: {{ .Values.backup.images.postgres | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/restore.sh"]
              env:
                - name: PGPASSWORD
                  value: restore-test
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: authentik-backup-scripts
            - name: work
              emptyDir: {}
            - name: pgdata
              emptyDir: {}
            - name: identity
              secret:
                secretName: {{ .Values.backup.restoreTest.ageIdentitySecret }}
{{- end }}
