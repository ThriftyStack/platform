{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: authentik-backup
          automountServiceAccountToken: false
          # RWO media is already attached to the server node. Affinity puts this
          # pod there so the volume can mount read-only beside server and worker.
          affinity:
            {{- include "thrifty-authentik.serverPodAffinity" . | nindent 12 }}
          initContainers:
            - name: dump
              image: {{ .Values.backup.images.postgres | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/dump.sh"]
              env:
                {{- include "thrifty-authentik.backupPostgresEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: media
                  mountPath: /data
                  readOnly: true
            {{- include "thrifty-authentik.ageEncrypt" (dict "root" . "file" "authentik.dump") | nindent 12 }}
            {{- include "thrifty-authentik.ageEncrypt" (dict "root" . "file" "data.tar.gz") | nindent 12 }}
            {{- include "thrifty-authentik.ageEncrypt" (dict "root" . "file" "manifest.env") | nindent 12 }}
          containers:
            - name: upload
              image: {{ .Values.backup.images.awsCli | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/upload.sh"]
              env:
                - name: AGE_RECIPIENT
                  value: {{ .Values.backup.ageRecipient | quote }}
                {{- include "thrifty-authentik.backupAwsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: authentik-backup-scripts
            - name: work
              emptyDir: {}
            - name: media
              persistentVolumeClaim:
                claimName: {{ .Values.media.claimName }}
                readOnly: true
{{- end }}
