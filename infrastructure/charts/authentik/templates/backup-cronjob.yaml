{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      # Finished Jobs and their pods remain for a day. This does not delete the
      # pod at BackoffLimitExceeded.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: authentik-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          # OnFailure keeps the pod Running while the kubelet restarts the
          # container. Kubernetes 1.36 counts those restarts toward backoffLimit
          # and then deletes that still-active pod, so the logs disappear.
          # Never leaves the failed pod until the 24h TTL.
          restartPolicy: Never
          serviceAccountName: authentik-backup
          automountServiceAccountToken: false
          # Images default to root. 1000 matches the media volume owner and the
          # mode 0600 files these containers pass through /work. /tmp is an
          # emptyDir because the root filesystem is read-only.
          securityContext:
            {{- include "thrifty-authentik.restrictedPod" . | nindent 12 }}
          # RWO media is already attached to the server node. Affinity puts this
          # pod there so the volume can mount read-only beside server and worker.
          affinity:
            {{- include "thrifty-authentik.serverPodAffinity" . | nindent 12 }}
          initContainers:
            - name: dump
              image: {{ .Values.backup.images.postgres | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/dump.sh"]
              env:
                {{- include "thrifty-authentik.backupPostgresEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              securityContext:
                {{- include "thrifty-authentik.restrictedContainer" (dict "runAsUser" 1000 "runAsGroup" 1000) | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: media
                  mountPath: /data
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
            {{- include "thrifty-authentik.ageEncrypt" (dict "root" . "file" "authentik.dump") | nindent 12 }}
            {{- include "thrifty-authentik.ageEncrypt" (dict "root" . "file" "data.tar.gz") | nindent 12 }}
            {{- include "thrifty-authentik.ageEncrypt" (dict "root" . "file" "manifest.env") | nindent 12 }}
          containers:
            - name: upload
              image: {{ .Values.backup.images.awsCli | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/upload.sh"]
              workingDir: /tmp
              env:
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: AGE_RECIPIENT
                  value: {{ .Values.backup.ageRecipient | quote }}
                {{- include "thrifty-authentik.backupAwsEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                {{- include "thrifty-authentik.restrictedContainer" (dict "runAsUser" 1000 "runAsGroup" 1000) | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
                {{- include "thrifty-authentik.minioCaMount" . | nindent 16 }}
          volumes:
            - name: scripts
              configMap:
                name: authentik-backup-scripts
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: media
              persistentVolumeClaim:
                claimName: {{ .Values.media.claimName }}
                readOnly: true
            {{- include "thrifty-authentik.minioCaVolume" . | nindent 12 }}
{{- end }}
