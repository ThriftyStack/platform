{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.backup.minio.esoServiceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault-auth
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.backup.minio.esoServiceAccount }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault-auth
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ .Values.backup.minio.esoServiceAccount | quote }}]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.backup.minio.esoServiceAccount }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.backup.minio.esoServiceAccount }}-token
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backup.minio.controllerServiceAccount }}
    namespace: {{ .Values.backup.minio.controllerNamespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.backup.minio.listenerCaConfigMap }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault-auth
data:
  # Public DevOops Issuing CA E1 chain. ThriftyStack/crossplane references
  # ConfigMap vault-oke-ca and does not commit the PEM (deploy/authentik/README.md).
  {{ .Values.backup.minio.listenerCaKey }}: {{ .Values.backup.minio.listenerCa | quote }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.backup.minio.secretStore }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault-auth
spec:
  provider:
    vault:
      server: {{ .Values.backup.minio.vaultServer | quote }}
      path: {{ .Values.backup.minio.vaultMount | quote }}
      version: {{ .Values.backup.minio.vaultKvVersion | quote }}
      caProvider:
        type: ConfigMap
        name: {{ .Values.backup.minio.listenerCaConfigMap }}
        key: {{ .Values.backup.minio.listenerCaKey }}
      auth:
        jwt:
          path: {{ .Values.backup.minio.vaultAuthPath | quote }}
          role: {{ .Values.backup.minio.vaultRole | quote }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: {{ .Values.backup.minio.esoServiceAccount }}
              audiences:
                - {{ .Values.backup.minio.vaultAudience | quote }}
{{- end }}
