{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.minio.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.backup.minio.secretStore }}
    kind: {{ .Values.backup.minio.secretStoreKind }}
  target:
    name: {{ .Values.backup.minio.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.backup.minio.accessKeyProperty }}
      remoteRef:
        key: {{ .Values.backup.minio.vaultPath }}
        property: {{ .Values.backup.minio.accessKeyProperty }}
    - secretKey: {{ .Values.backup.minio.secretKeyProperty }}
      remoteRef:
        key: {{ .Values.backup.minio.vaultPath }}
        property: {{ .Values.backup.minio.secretKeyProperty }}
{{- end }}
