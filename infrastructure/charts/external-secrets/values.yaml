---
external-secrets:
  leaderElect: true
  replicaCount: 2
  installCRDs: true
  crds:
    conversion:
      enabled: false
  openshiftFinalizers: false
  bitwarden-sdk-server:
    enabled: false
  global:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  webhook:
    replicaCount: 2
    certManager:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  certController:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  extraObjects:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oke-vault-listener-ca
        namespace: external-secrets
      data:
        # Same public chain as the authentik chart: E1, then self-signed R1.
        # Not a private key. No SecretStore in this chart consumes it.
