---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: mgmt-internal
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  blocks:
    - cidr: 10.0.50.0/28
  allowFirstLastIPs: "No"
  serviceSelector:
    matchLabels:
      thriftystack.io/lb-pool: mgmt-internal
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: mgmt-lb
  labels:
    advertise: bgp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          thriftystack.io/lb-pool: mgmt-internal
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: unifi-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 15
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: mgmt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: mgmt
      localASN: 65030
      peers:
        - name: unifi
          peerASN: 65020
          peerAddress: 10.0.10.254
          peerConfigRef:
            name: unifi-gateway
