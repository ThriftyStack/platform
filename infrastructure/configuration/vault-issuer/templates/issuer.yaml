---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-vault-auth
  namespace: istio-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-vault-token
  namespace: istio-system
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - istio-vault-auth
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-vault-token
  namespace: istio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-vault-token
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
{{- if eq .Values.cluster.id "management" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: oke-vault-listener-ca
  namespace: istio-system
type: Opaque
stringData:
  ca.crt: |
{{ required "oke vault listener CA" (.Files.Get "files/oke-vault-listener-ca.crt") | indent 4 }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-istio
  namespace: istio-system
spec:
  vault:
    {{- if eq .Values.cluster.id "management" }}
    server: https://vault.devoops.uk
    path: pki_mesh_mgmt/sign/mesh
    caBundleSecretRef:
      name: oke-vault-listener-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/jwt-management
        role: istio-system_istio-vault-auth
        serviceAccountRef:
          name: istio-vault-auth
          audiences:
          - vault://istio-system/vault-istio
    {{- else }}
    server: {{ .Values.cluster.vaultAddress }}
    path: {{ .Values.cluster.pkiMount }}/sign/istio
    caBundleSecretRef:
      name: vault-bootstrap-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: "/v1/auth/{{ .Values.cluster.authMount }}"
        role: {{ .Values.cluster.signerRole }}
        serviceAccountRef:
          name: istio-vault-auth
          audiences:
          - vault://istio-system/vault-istio
    {{- end }}
