apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-root-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  ca.pem: |-
{{ .Files.Get "files/mesh-root-2026.crt" | trim | nindent 4 }}
