# Exporters are visible only to this namespace's collector, with no LAN listener.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: vmagent }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 9100, protocol: TCP }
